<!doctype html>
<html lang="zh-CN" data-theme="chrome-day">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SidebarMobile</title>
    <link rel="stylesheet" href="styles/themes.css" />
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <!-- 侧栏骨架：顶栏 + 单视图区 + 底部五键常驻（design-system/MASTER.md §2 布局锁定项） -->
    <div id="app" class="sidebar" data-view="site-list">
      <p id="noticeBar" class="notice-bar" role="status" hidden></p>

      <!-- 统一顶栏：网址栏（图标 + 抬头文本）+ 深浅主题翻转钮 -->
      <header class="topbar">
        <div id="urlBar" class="urlbar" aria-label="当前位置：主页">
          <span id="urlBarIcon" class="urlbar-icon urlbar-product" aria-hidden="true"></span>
          <span id="urlBarText" class="urlbar-text">主页</span>
          <span
            id="urlBarBadge"
            class="urlbar-badge"
            title="地址可能未同步"
            aria-label="地址可能未同步"
            hidden
            >?</span
          >
        </div>
        <button id="themeFlipButton" class="icon-btn" type="button" aria-label="切换到深色主题"></button>
      </header>

      <div class="views">
        <!-- 视图 A：网站列表主页 -->
        <section id="viewSiteList" class="view view-home" aria-label="网站列表主页">
          <div class="home-brand">
            <div class="brand-logo" id="brandLogo" aria-hidden="true"></div>
            <p class="brand-name">侧栏浏览器</p>
            <form id="addUrlForm" class="add-url" novalidate>
              <input
                id="addUrlInput"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="添加网址，如 example.com"
                aria-label="添加网址，仅支持 http 与 https"
              />
              <button id="addUrlSubmit" class="add-url-btn" type="submit" aria-label="添加并打开"></button>
            </form>
            <p id="addUrlError" class="add-url-error" role="alert" hidden></p>
          </div>

          <div class="home-grid-wrap">
            <div id="siteGrid" class="site-grid" role="list" aria-label="已保存的网站"></div>
            <p id="siteGridEmpty" class="empty-hint" hidden>还没有保存的网站，在上方输入网址添加一个吧。</p>
          </div>
        </section>

        <!-- 视图 B：网页浏览（每标签一个 iframe 宿主，内容区占满中段） -->
        <section id="viewBrowser" class="view view-browser" aria-label="网页浏览" hidden>
          <div id="browserContent" class="content-area" tabindex="-1" aria-label="网页内容区"></div>
        </section>
      </div>

      <!-- 底部五键导航（双视图常驻） -->
      <nav class="bottom-nav" aria-label="浏览器导航">
        <button id="navBack" class="icon-btn nav-btn" type="button" aria-label="后退"></button>
        <button id="navForward" class="icon-btn nav-btn" type="button" aria-label="前进"></button>
        <button id="navHome" class="icon-btn nav-btn" type="button" aria-label="返回主页"></button>
        <button id="navTabCount" class="icon-btn nav-btn tab-count-btn" type="button" aria-label="标签列表，共 0 个标签">
          <span id="navTabCountBox" class="tab-count-box">0</span>
        </button>
        <button id="navMenu" class="icon-btn nav-btn" type="button" aria-label="菜单"></button>
      </nav>

      <!-- 悬停图标子菜单（单实例共享；悬停接线属 US6） -->
      <div id="iconMenu" class="icon-menu" role="menu" hidden></div>

      <!-- 底部弹层（遮罩 + 面板） -->
      <div id="sheetOverlay" class="sheet-overlay" hidden></div>
      <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>

      <div id="toast" class="toast" role="status" hidden></div>
    </div>
    <script src="sidebar.js"></script>
  </body>
</html>
